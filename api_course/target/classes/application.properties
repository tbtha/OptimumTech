# http://localhost:8082/course
spring.application.name=api_course
server.port=8082
#Mostrar errores descriptivos
server.error.include-binding-errors=always
server.error.include-message=always
#Configuracion de mysql
spring.datasource.url=jdbc:mysql://localhost:3306/bd_course?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Configuración de JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

#Healt endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always