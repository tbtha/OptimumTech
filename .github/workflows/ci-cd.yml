name: OptimumTech CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test api_course
        working-directory: ./api_course
        run: mvn clean verify
      
        - name: JaCoCo Coverage Report
          working-directory: ./api_course
          run: mvn jacoco:report
      
        - name: Snyk - Análisis de dependencias y seguridad
          uses: snyk/actions/maven@master
          with:
            args: test
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      
        - name: SonarQube - Análisis de calidad de código
          uses: sonarsource/sonarqube-scan-action@master
          with:
            projectBaseDir: ./api_course
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build Docker image api_course
        working-directory: ./api_course
        run: docker build -t api_course .

      - name: Verify Docker Compose
        run: docker compose config
